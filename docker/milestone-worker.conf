# Install alongside the existing Supervisor configuration when deploying milestones.
[program:laravel-worker-notifications]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work database --queue=notifications --sleep=1 --tries=1 --timeout=45 --max-time=3600
numprocs=2
autostart=true
autorestart=true
startretries=60
user=root
stopasgroup=true
killasgroup=true
